name: Publish Linux package repositories

# Only this repository holds the signing key and R2 credentials. Applications
# send a repository_dispatch (event type publish-linux-packages) whose
# client_payload.sources lists owner/repo@tag release sources, one per line.
# Every source repository must appear in allowed-sources.txt.
on:
  repository_dispatch:
    types: [publish-linux-packages]
  workflow_dispatch:
    inputs:
      sources:
        description: Release sources to publish, one owner/repo@tag per line
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish signed apt and dnf repositories
    runs-on: ubuntu-24.04
    environment:
      name: linux-repository
    concurrency:
      group: linux-repository
      cancel-in-progress: false
    env:
      SOURCES_INPUT: ${{ inputs.sources || github.event.client_payload.sources }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.LINUX_REPOSITORY_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.LINUX_REPOSITORY_R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.LINUX_REPOSITORY_R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.LINUX_REPOSITORY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm

      - name: Install rclone
        # Ubuntu's rclone 1.60 gets HTTP 501 from R2 on uploads; pin a current release.
        # Not named RCLONE_VERSION: rclone reads RCLONE_* variables as flags.
        env:
          PINNED_RCLONE_VERSION: v1.76.0
        run: |
          set -euo pipefail
          case "$(dpkg --print-architecture)" in
            amd64) deb_sha256=9db7ee9b725bce7cdd195b9183449a4c6fb93cad3e6578e70b87c0bc7f6062e9 ;;
            arm64) deb_sha256=c486d404ecbc4bb3d54052a0efaf9e652cf0d2c645e4523f7a2aefa112fe029c ;;
            *) echo "Unsupported architecture" >&2; exit 1 ;;
          esac
          deb="$RUNNER_TEMP/rclone.deb"
          arch="$(dpkg --print-architecture)"
          curl -fsSL -o "$deb" \
            "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/rclone-$PINNED_RCLONE_VERSION-linux-$arch.deb"
          echo "$deb_sha256  $deb" | sha256sum --check --strict
          sudo apt-get install -y "$deb"
          rclone version

      - name: Create source read token
        id: source_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LINUX_REPOSITORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LINUX_REPOSITORY_APP_PRIVATE_KEY }}
          owner: jerney-nexus

      - name: Download release packages
        env:
          GH_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          packages_dir="$RUNNER_TEMP/packages"
          mkdir -p "$packages_dir"
          source_count=0
          while IFS= read -r source; do
            source="${source//[[:space:]]/}"
            [[ -n "$source" ]] || continue
            if [[ ! "$source" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[A-Za-z0-9._+-]+$ ]]; then
              echo "Invalid source (expected owner/repo@tag): $source" >&2
              exit 1
            fi
            repo="${source%@*}"
            tag="${source##*@}"
            if ! grep -Fxq "$repo" allowed-sources.txt; then
              echo "Source repository is not in allowed-sources.txt: $repo" >&2
              exit 1
            fi
            source_dir="$packages_dir/${repo//\//_}"
            mkdir -p "$source_dir"
            gh release download "$tag" \
              --repo "$repo" \
              --dir "$source_dir" \
              --pattern '*.deb' \
              --pattern '*.rpm'
            # GitHub records a SHA-256 digest for every release asset when it is uploaded.
            # Each downloaded package must match that digest before it is published.
            digest_list="$RUNNER_TEMP/digests-${repo//\//_}.tsv"
            gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[] | [.name, .digest] | @tsv' >"$digest_list"
            package_count=0
            for package in "$source_dir"/*.deb "$source_dir"/*.rpm; do
              [[ -e "$package" ]] || continue
              name="$(basename "$package")"
              expected="$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' "$digest_list")"
              if [[ ! "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "No SHA-256 digest recorded for $repo@$tag asset: $name" >&2
                exit 1
              fi
              actual="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
              if [[ "$actual" != "$expected" ]]; then
                echo "Digest mismatch for $repo@$tag asset: $name" >&2
                exit 1
              fi
              package_count=$((package_count + 1))
            done
            if ((package_count == 0)); then
              echo "No .deb or .rpm assets found for $repo@$tag" >&2
              exit 1
            fi
            echo "Verified $package_count package digest(s) for $repo@$tag"
            source_count=$((source_count + 1))
          done <<<"$SOURCES_INPUT"
          if ((source_count == 0)); then
            echo "No release sources were provided" >&2
            exit 1
          fi

      - name: Import repository signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPOSITORY_GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download published repositories
        run: |
          repo_root="$RUNNER_TEMP/repo"
          mkdir -p "$repo_root"
          rclone copy "r2:$R2_BUCKET" "$repo_root"

      - name: Add packages and sign repositories
        env:
          LINUX_REPOSITORY_GPG_KEY_ID: ${{ vars.LINUX_REPOSITORY_GPG_KEY_ID }}
        run: |
          mapfile -t packages < <(
            find "$RUNNER_TEMP/packages" -type f \( -name '*.deb' -o -name '*.rpm' \) | sort
          )
          if ((${#packages[@]} == 0)); then
            echo "No .deb or .rpm packages were downloaded" >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/stale-repodata.txt"
          bash scripts/build-linux-repositories.sh \
            --repo-root "$RUNNER_TEMP/repo" \
            --prune-list "$RUNNER_TEMP/stale-repodata.txt" \
            "${packages[@]}"

      - name: Upload repositories
        run: rclone copy "$RUNNER_TEMP/repo" "r2:$R2_BUCKET" --checksum

      - name: Remove superseded repodata
        run: |
          if [[ -s "$RUNNER_TEMP/stale-repodata.txt" ]]; then
            rclone delete "r2:$R2_BUCKET" --files-from-raw "$RUNNER_TEMP/stale-repodata.txt"
          else
            echo "No superseded repodata to remove"
          fi
